[package]
name = "zauterm"
version = "3.3.4"
description = "ZauTerm - cross-platform terminal (SSH/SFTP/Telnet/Serial/Local)"
authors = ["zhuhezhang"]
edition = "2021"  # Rust版本

[lib]
name = "zauterm_lib"  # 库在代码名字，所以 main.rs 里是 zauterm_lib::run()
crate-type = ["staticlib", "cdylib", "rlib"]  # 指定编译库的类型

[build-dependencies]  # 编译前先跑的依赖
tauri-build = { version = "2", features = ["isolation"] }  # tauri-build：生成/嵌入 Tauri 需要的构建产物（配置、权限等）；features = ["isolation"]：打开 isolation 相关构建支持，对应项目里的 src-isolation/（IPC 白名单）

[dependencies]  # 运行所需依赖库
tauri = { version = "2", features = ["macos-private-api", "isolation"] }  # features = 「这个库里哪些可选模块要编译进来」
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
thiserror = "2"
anyhow = "1"
parking_lot = "0.12"
dashmap = "6"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
dirs = "6"
encoding_rs = "0.8"
ssh2 = { version = "0.9", features = ["openssl-on-win32"] }  # openssl-on-win32 使得 userauth_pubkey_memory 在 Windows 可用 (Unix 默认已有)
serialport = "4"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
rand = "0.8"
chacha20poly1305 = "0.10"
walkdir = "2"
once_cell = "1"
tauri-plugin-clipboard-manager = "2"
portable-pty = "0.9"

[profile.release]  # 正式发布如何编译
panic = "abort"  # panic 直接中止，不展开完整展开栈，体积更小
codegen-units = 1  # 代码生成单元少 → 优化更狠，编得更慢
lto = true  # 链接期优化，跨 crate 优化
opt-level = "s"  # 优化目标偏 体积小（还有 3 偏速度、z 更极致体积）
strip = true  # 去掉调试符号，进一步缩小

# Windows：ssh2 openssl-on-win32 需要 OpenSSL；vendored 从源码编进，免本机安装
[target.'cfg(windows)'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]  # 编译目标是 macOS 才拉这些依赖
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSButton", "NSResponder"] }
