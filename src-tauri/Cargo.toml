[package]
name = "zterm"
version = "3.2.9"
description = "ZTerm - cross-platform terminal (SSH/SFTP/Telnet/Serial)"
authors = ["zhuhezhang"]
edition = "2021"

[lib]
name = "zterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
thiserror = "2"
anyhow = "1"
parking_lot = "0.12"
dashmap = "6"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
dirs = "6"
encoding_rs = "0.8"
ssh2 = "0.9"
serialport = "4"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
rand = "0.8"
chacha20poly1305 = "0.10"
walkdir = "2"
once_cell = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSGeometry"] }
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSView", "NSButton", "NSResponder"] }
